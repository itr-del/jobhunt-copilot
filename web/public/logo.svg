<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 品牌标：圆角方形信号塔青底，白色「罗盘+纸飞机」融合图形 -->
  <rect width="48" height="48" rx="6" fill="#0D7377"/>
  <!-- 罗盘外圈：一圈细弧（缺口朝向纸飞机飞出方向） -->
  <path d="M25.1 38.3 A12 12 0 1 1 32.3 31.1" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 罗盘指针化作向右上方飞行的纸飞机 -->
  <path d="M37.5 10.5 L18 24.5 L26 25.5 Z" fill="#FFFFFF"/>
  <path d="M37.5 10.5 L26 25.5 L24.5 33.5 Z" fill="#FFFFFF" opacity="0.82"/>
</svg>
